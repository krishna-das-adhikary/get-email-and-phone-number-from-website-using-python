<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Add Websites</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="p-4">
<div class="container">
    <h1 class="mb-4">Add Websites to Crawl</h1>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, msg in messages %}
          <div class="alert alert-{{ category }}">{{ msg }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}
    <form method="post">
        <div class="mb-3">
            <label for="websites" class="form-label">Paste websites (one per line):</label>
            <textarea id="websites" name="websites" rows="10" class="form-control" placeholder="https://example.com/"></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Insert Websites</button>
        <a href="/" class="btn btn-secondary">Back to Dashboard</a>
    </form>
</div>
</body>
</html>
